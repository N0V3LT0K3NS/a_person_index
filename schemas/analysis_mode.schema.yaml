        type: array
      preferred_entrypoints:
        items:
          type: string
        title: Preferred Entrypoints
        type: array
      typical_outputs:
        items:
          type: string
        title: Typical Outputs
        type: array
      cautions:
        items:
          type: string
        title: Cautions
        type: array
      notes:
        anyOf:
        - type: string
        - type: 'null'
