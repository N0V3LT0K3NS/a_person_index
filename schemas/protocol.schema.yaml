$defs:
  Protocol:
    additionalProperties: false
    properties:
      id:
        title: Id
        type: string
      name:
        title: Name
        type: string
      status:
        enum:
        - draft
        - experimental
        - active
        title: Status
        type: string
      program_kind:
        enum:
        - micro_program
        - translation_program
        - synthesis_program
        - artifact_program
        - research_program
        title: Program Kind
        type: string
      purpose:
        title: Purpose
        type: string
      summary:
        title: Summary
        type: string
      downstream_consumers:
        items:
          type: string
        title: Downstream Consumers
        type: array
      required_inputs:
        items:
          type: string
        title: Required Inputs
        type: array
      optional_inputs:
        items:
          type: string
        title: Optional Inputs
        type: array
      technique_ids:
        items:
          type: string
        title: Technique Ids
        type: array
      component_program_ids:
        items:
          type: string
        title: Component Program Ids
        type: array
      primary_outputs:
        items:
          type: string
        title: Primary Outputs
        type: array
      notes:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Notes
    required:
    - id
    - name
    - status
    - program_kind
    - purpose
    - summary
    title: Protocol
    type: object
additionalProperties: false
properties:
  protocols:
    items:
      $ref: '#/$defs/Protocol'
    title: Protocols
    type: array
required:
- protocols
title: ProtocolsDocument
type: object
