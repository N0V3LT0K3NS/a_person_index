        type: array
      required_capability_ids:
        items:
          type: string
        title: Required Capability Ids
        type: array
      optional_capability_ids:
        items:
          type: string
        title: Optional Capability Ids
        type: array
      steps:
        items:
          type: string
        title: Steps
        type: array
      cautions:
        items:
          type: string
        title: Cautions
        type: array
      notes:
        anyOf:
        - type: string
        - type: 'null'
