  source_entity_id: con_hexaco_honesty_humility
  target_entity_type: instrument
  target_entity_id: instr_dark_triad
  relationship_type: inverse_tendency
  relationship_strength: high
  rationale: Honesty-Humility often moves inversely to manipulative, exploitative,
    and entitled tendencies that cluster in Dark Triad measures.
  confidence: high
  notes: Construct-to-instrument mapping because the inverse relation spans multiple
    dark-trait constructs.
