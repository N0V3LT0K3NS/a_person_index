risks:
- id: rsk_culture_index_overinterpretation
  instrument_id: instr_culture_index
  risk_type: overinterpretation
  severity: medium
  description: Using proprietary workplace outputs for hiring, filtering, or succession
    decisions can amplify false precision, bias, and overconfidence.
  mitigation: Treat the framework as one layer among several and preserve uncertainty.
- instrument_id: instr_culture_index
  id: rsk_culture_index_black_box_hiring
  risk_type: workplace_misuse
  severity: high
  description: When proprietary profile outputs are treated as objective hiring truth,
    they can harden bias and false precision inside employment decisions.
  mitigation: Keep Culture Index subordinate to structured interviews, job-relevant
    evidence, and explicit adverse-impact review.
