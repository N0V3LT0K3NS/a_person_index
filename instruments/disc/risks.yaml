risks:
- id: rsk_disc_overinterpretation
  instrument_id: instr_disc
  risk_type: overinterpretation
  severity: medium
  description: DISC profiles are easy to overuse as simplified workplace identity
    boxes.
  mitigation: Treat the framework as one layer among several and preserve uncertainty.
- instrument_id: instr_disc
  id: rsk_disc_workplace_misuse
  risk_type: workplace_misuse
  severity: medium
  description: DISC labels are often reified into stable workplace identities or used
    to justify simplistic assumptions about collaboration, conflict, or role fit.
  mitigation: Use DiSC for communication prompts and avoid treating profile language
    as a full employment decision rule.
