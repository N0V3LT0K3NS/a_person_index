protocols:
  - id: proto_ilens
    name: ILENS
    status: experimental
    purpose: >
      Integrate multiple personality, symbolic, behavioral, and relational systems
      into a layered synthesis useful for learning, emotional navigation, and adaptive interaction.
    summary: >
      ILENS is a downstream synthesis protocol that treats frameworks as partial
      languages of personhood, preserves contradiction, and derives higher-order
      working parameters without collapsing everything into one test.
    downstream_consumers:
      - GNOMY
      - synthesis agents
    required_inputs:
      - instrument records
      - ontology annotations
      - crosswalks
      - construct mappings
      - motifs
    optional_inputs:
      - result atoms
      - behavioral observations
      - longitudinal feedback
      - symbolic self-descriptions
    technique_ids:
      - tech_cross_framework_translation
      - tech_paradox_scan
      - tech_contradiction_preservation
      - tech_stable_vs_adaptive_split
      - tech_result_atom_decomposition
      - tech_symbolic_vs_empirical_bracketing
    primary_outputs:
      - synthesized person-model parameters
      - learning guidance
      - communication guidance
      - interaction caveats
    notes: >
      ILENS is no longer treated as the ontology itself. It is an opinionated
      consumer of the registry, house synthesis layer, and protocol library.

  - id: proto_human_model_card
    name: Human Model Card
    status: experimental
    purpose: >
      Produce a formal, evidence-stratified report that models a person as an
      evolving cognitive-behavioral system rather than as a flattering type label.
    summary: >
      A report protocol that uses model-card language to organize personhood
      evidence, contradictions, deployment conditions, and failure modes.
    downstream_consumers:
      - GNOMY
      - analyst agents
      - research artifacts
    required_inputs:
      - behavioral corpus or comparable evidence bundle
      - protocol-safe provenance statement
      - registry records for any referenced frameworks
    optional_inputs:
      - result atoms
      - comparative memos
      - longitudinal traces
    technique_ids:
      - tech_paradox_scan
      - tech_contradiction_preservation
      - tech_stable_vs_adaptive_split
    primary_outputs:
      - human model card artifact
      - deployment guidance
      - caveats and known unknowns
    notes: >
      This protocol belongs to the applied synthesis layer. It should not be
      mistaken for canonical framework data.

  - id: proto_translation_memo
    name: Translation Memo
    status: active
    purpose: >
      Generate an evidence-aware memo about overlap, divergence, and incommensurability
      between selected frameworks or constructs.
    summary: >
      A compact comparative protocol for agents that need to explain how two or
      more systems connect without forcing a single unified language.
    downstream_consumers:
      - GNOMY
      - curation agents
      - compare workflows
    required_inputs:
      - instrument records
      - crosswalks
      - construct mappings
    optional_inputs:
      - research observations
      - mapping votes
    technique_ids:
      - tech_cross_framework_translation
      - tech_symbolic_vs_empirical_bracketing
    primary_outputs:
      - overlap memo
      - mismatch warnings
      - suggested follow-up mappings
    notes: >
      Translation memos are useful baseline artifacts for both curation and
      downstream synthesis.
