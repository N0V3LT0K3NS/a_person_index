protocols:
  - id: proto_paradox_finder
    name: Paradox Finder
    status: active
    program_kind: micro_program
    purpose: >
      Surface load-bearing contradictions, layer mismatches, and unresolved
      tensions across frameworks, constructs, motifs, or result atoms without
      averaging them away.
    summary: >
      A compact index program that packages paradox scanning and contradiction
      preservation into a reusable analysis pass. It can stand alone or serve as
      a component program inside larger synthesis workflows.
    downstream_consumers:
      - GNOMY
      - synthesis agents
      - curation agents
    required_inputs:
      - result atoms or comparable comparative signals
      - construct mappings
      - motif traces or comparison outputs
    optional_inputs:
      - behavioral observations
      - longitudinal notes
      - house interaction hypotheses
    technique_ids:
      - tech_paradox_scan
      - tech_contradiction_preservation
      - tech_stable_vs_adaptive_split
    component_program_ids: []
    primary_outputs:
      - paradox candidate memo
      - tension map
      - unresolved contradiction notes
    notes: >
      Useful both as a standalone analysis program and as a reusable component
      inside larger synthesis programs such as ILENS or Human Model Card.

  - id: proto_ilens
    name: ILENS
    status: experimental
    program_kind: synthesis_program
    purpose: >
      Integrate multiple personality, symbolic, behavioral, and relational systems
      into a layered synthesis useful for learning, emotional navigation, and adaptive interaction.
    summary: >
      ILENS is a downstream synthesis program that treats frameworks as partial
      languages of personhood, preserves contradiction, and derives higher-order
      working parameters without collapsing everything into one test.
    downstream_consumers:
      - GNOMY
      - synthesis agents
    required_inputs:
      - instrument records
      - ontology annotations
      - crosswalks
      - construct mappings
      - motifs
    optional_inputs:
      - result atoms
      - behavioral observations
      - longitudinal feedback
      - symbolic self-descriptions
    technique_ids:
      - tech_cross_framework_translation
      - tech_paradox_scan
      - tech_contradiction_preservation
      - tech_stable_vs_adaptive_split
      - tech_result_atom_decomposition
      - tech_symbolic_vs_empirical_bracketing
    component_program_ids:
      - proto_paradox_finder
      - proto_translation_memo
    primary_outputs:
      - synthesized person-model parameters
      - learning guidance
      - communication guidance
      - interaction caveats
    notes: >
      ILENS is no longer treated as the ontology itself. It is an opinionated
      consumer of the registry, house synthesis layer, and index-program layer.

  - id: proto_human_model_card
    name: Human Model Card
    status: experimental
    program_kind: artifact_program
    purpose: >
      Produce a formal, evidence-stratified report that models a person as an
      evolving cognitive-behavioral system rather than as a flattering type label.
    summary: >
      A report program that uses model-card language to organize personhood
      evidence, contradictions, deployment conditions, and failure modes.
    downstream_consumers:
      - GNOMY
      - analyst agents
      - research artifacts
    required_inputs:
      - behavioral corpus or comparable evidence bundle
      - protocol-safe provenance statement
      - registry records for any referenced frameworks
    optional_inputs:
      - result atoms
      - comparative memos
      - longitudinal traces
    technique_ids:
      - tech_paradox_scan
      - tech_contradiction_preservation
      - tech_stable_vs_adaptive_split
    component_program_ids:
      - proto_paradox_finder
    primary_outputs:
      - human model card artifact
      - deployment guidance
      - caveats and known unknowns
    notes: >
      This index program belongs to the applied synthesis layer. It should not be
      mistaken for canonical framework data.

  - id: proto_translation_memo
    name: Translation Memo
    status: active
    program_kind: translation_program
    purpose: >
      Generate an evidence-aware memo about overlap, divergence, and incommensurability
      between selected frameworks or constructs.
    summary: >
      A compact comparative program for agents that need to explain how two or
      more systems connect without forcing a single unified language.
    downstream_consumers:
      - GNOMY
      - curation agents
      - compare workflows
    required_inputs:
      - instrument records
      - crosswalks
      - construct mappings
    optional_inputs:
      - research observations
      - mapping votes
    technique_ids:
      - tech_cross_framework_translation
      - tech_symbolic_vs_empirical_bracketing
    component_program_ids: []
    primary_outputs:
      - overlap memo
      - mismatch warnings
      - suggested follow-up mappings
    notes: >
      Translation memos are useful baseline artifacts for both curation and
      downstream synthesis.

  - id: proto_contextual_comparison
    name: Contextual Comparison Memo
    status: experimental
    program_kind: comparison_program
    purpose: >
      Compare one subject across time slices, roles, or contexts without
      confusing sparse deltas, adaptive overlays, and genuine baseline change.
    summary: >
      A comparison program for repeated or context-tagged personhood evidence
      that keeps stable-versus-adaptive framing, paradox preservation, and
      missingness explicit rather than smoothing them into one narrative arc.
    downstream_consumers:
      - analyst agents
      - actualization agents
      - contextual comparison workflows
    required_inputs:
      - context-tagged result atoms or comparable structured outputs
      - declared context or time slices
      - consistent comparative axes or motif traces
    optional_inputs:
      - longitudinal notes
      - role descriptions
      - behavioral observations
    technique_ids:
      - tech_result_atom_decomposition
      - tech_stable_vs_adaptive_split
      - tech_paradox_scan
      - tech_contradiction_preservation
    component_program_ids:
      - proto_paradox_finder
    primary_outputs:
      - contextual comparison memo
      - baseline versus adaptive split notes
      - delta caution map
    notes: >
      Best used when the same or comparable frameworks have been collected for
      more than one context, role, or time slice. Sparse coverage should reduce
      the density and confidence of the output rather than forcing a narrative.

  - id: proto_pairwise_relational_comparison
    name: Pairwise Relational Comparison
    status: experimental
    program_kind: comparison_program
    purpose: >
      Compare two subject stacks side by side without collapsing convergence,
      friction, orthogonality, and missingness into one compatibility score.
    summary: >
      A comparison program for pairwise or relationship-adjacent work that uses
      translation, paradox preservation, and evidence bracketing to keep
      relational claims scoped to what the inputs can actually support.
    downstream_consumers:
      - analyst agents
      - actualization agents
      - relational comparison workflows
    required_inputs:
      - two explicitly separated stacks or structured result bundles
      - framework records for any compared systems
      - declared comparison question or relationship context
    optional_inputs:
      - relational history notes
      - attachment or care-signaling context
      - behavioral observations
    technique_ids:
      - tech_cross_framework_translation
      - tech_paradox_scan
      - tech_contradiction_preservation
      - tech_symbolic_vs_empirical_bracketing
    component_program_ids:
      - proto_translation_memo
      - proto_paradox_finder
    primary_outputs:
      - pairwise relational sheet
      - convergence and friction memo
      - missing-seam notes
    notes: >
      This program is for disciplined pairwise comparison, not deterministic
      compatibility scoring. It should preserve asymmetry and leave unsupported
      seams visible.
