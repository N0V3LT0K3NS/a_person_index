name: Codex Task

on:
  workflow_dispatch:
    inputs:
      task_title:
        description: Short title for the Codex task
        required: false
        type: string
      task_body:
        description: Full task description and acceptance criteria
        required: false
        type: string
      task_id:
        description: Optional task ID from .github/codex/task_queue.yaml
        required: false
        type: string
      base_branch:
        description: Base branch for the pull request
        required: false
        default: main
        type: string
      issue_number:
        description: Optional GitHub issue number to comment back on
        required: false
        type: string
      verification_commands:
        description: Newline-separated verification commands
        required: false
        type: string
        default: |
          python3 scripts/export_schemas.py
          python3 scripts/validate.py
          python3 scripts/build_index.py
          python3 scripts/generate_docs.py
          npm run mcp:smoke
          python3 -m pytest
  issues:
    types:
      - opened
      - edited
      - labeled

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  codex-task:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && contains(join(github.event.issue.labels.*.name, ','), 'codex-task')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Configure Git author
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Render queue task
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task_id != '' }}
        run: |
          python scripts/render_codex_task_from_queue.py "${{ inputs.task_id }}" --format json > task.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("task.json").read_text(encoding="utf-8"))
          Path("task-title.txt").write_text(payload["title"], encoding="utf-8")
          Path("task-body.md").write_text(payload["body"], encoding="utf-8")
          verification = payload.get("verification", [])
          Path("verification-commands.txt").write_text("\n".join(verification) + "\n", encoding="utf-8")
          PY

      - name: Capture manual dispatch task
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task_id == '' }}
        env:
          INPUT_TASK_TITLE: ${{ inputs.task_title }}
          INPUT_TASK_BODY: ${{ inputs.task_body }}
          INPUT_VERIFICATION: ${{ inputs.verification_commands }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          Path("task-title.txt").write_text(os.environ.get("INPUT_TASK_TITLE", ""), encoding="utf-8")
          Path("task-body.md").write_text(os.environ.get("INPUT_TASK_BODY", ""), encoding="utf-8")
          Path("verification-commands.txt").write_text(os.environ.get("INPUT_VERIFICATION", ""), encoding="utf-8")
          PY

      - name: Capture issue task
        if: ${{ github.event_name == 'issues' }}
        env:
          ISSUE_TASK_TITLE: ${{ github.event.issue.title }}
          ISSUE_TASK_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          default_verification = "\n".join(
              [
                  "python3 scripts/export_schemas.py",
                  "python3 scripts/validate.py",
                  "python3 scripts/build_index.py",
                  "python3 scripts/generate_docs.py",
                  "npm run mcp:smoke",
                  "python3 -m pytest",
              ]
          )
          Path("task-title.txt").write_text(os.environ["ISSUE_TASK_TITLE"], encoding="utf-8")
          Path("task-body.md").write_text(os.environ["ISSUE_TASK_BODY"], encoding="utf-8")
          Path("verification-commands.txt").write_text(default_verification + "\n", encoding="utf-8")
          PY

      - name: Export task variables
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_NUMBER_VALUE="${{ inputs.issue_number }}"
            BASE_BRANCH_VALUE="${{ inputs.base_branch }}"
            TASK_ID_VALUE="${{ inputs.task_id }}"
          else
            ISSUE_NUMBER_VALUE="${{ github.event.issue.number }}"
            BASE_BRANCH_VALUE="main"
            TASK_ID_VALUE=""
          fi

          BRANCH_SUFFIX="${{ github.run_id }}"
          if [ -n "${TASK_ID_VALUE}" ]; then
            BRANCH_SUFFIX="${TASK_ID_VALUE}"
          elif [ -n "${ISSUE_NUMBER_VALUE}" ]; then
            BRANCH_SUFFIX="issue-${ISSUE_NUMBER_VALUE}"
          fi

          echo "BASE_BRANCH=${BASE_BRANCH_VALUE}" >> "$GITHUB_ENV"
          echo "ISSUE_NUMBER=${ISSUE_NUMBER_VALUE}" >> "$GITHUB_ENV"
          echo "TASK_ID=${TASK_ID_VALUE}" >> "$GITHUB_ENV"
          echo "WORK_BRANCH=codex/${BRANCH_SUFFIX}" >> "$GITHUB_ENV"
          {
            echo "TASK_TITLE<<EOF"
            cat task-title.txt
            printf '\n'
            echo "EOF"
            echo "TASK_BODY<<EOF"
            cat task-body.md
            printf '\n'
            echo "EOF"
            echo "VERIFICATION_COMMANDS<<EOF"
            cat verification-commands.txt
            printf '\n'
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build Codex prompt
        run: |
          {
            echo "Repository: A Person Index (API)"
            echo
            echo "Read and follow these first:"
            echo "- AGENTS.md"
            echo "- README.md"
            echo "- CONTRIBUTING.md"
            echo "- docs/current_state.md"
            echo "- docs/architecture.md"
            echo "- docs/index_programs.md"
            echo "- docs/codex_automation.md"
            echo "- docs/research_authoring_standard.md"
            echo "- docs/expansion_program.md"
            echo "- docs/system_boundaries.md"
            echo "- docs/phase_3_4_plan.md"
            echo "- generated/manifest.json"
            echo
            echo "Automation context:"
            cat .github/codex/automation_context.md
            echo
            if [ -n "${TASK_ID}" ]; then
              echo "Queue task id:"
              echo "${TASK_ID}"
              echo
            fi
            echo "Task title:"
            echo "${TASK_TITLE}"
            echo
            echo "Task body:"
            echo "${TASK_BODY}"
            echo
            echo "Required verification commands:"
            echo "${VERIFICATION_COMMANDS}"
            echo
            echo "Requirements:"
            echo "- Keep changes scoped and PR-ready."
            echo "- Rebuild generated outputs if source files change."
            echo "- Update docs/tests when behavior or public framing changes."
            echo "- If a verification command is intentionally not applicable, explain that in the PR body."
          } > codex-task.prompt

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: codex-task.prompt
          output-file: codex-last-message.txt
          working-directory: ${{ github.workspace }}
          sandbox: danger-full-access
          safety-strategy: drop-sudo
          allow-bots: true

      - name: Run verification
        run: |
          while IFS= read -r command; do
            [ -z "$command" ] && continue
            echo "Running: $command"
            bash -lc "$command"
          done <<< "$VERIFICATION_COMMANDS"

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ env.BASE_BRANCH }}
          branch: ${{ env.WORK_BRANCH }}
          title: ${{ env.TASK_TITLE }}
          commit-message: "codex: ${{ env.TASK_TITLE }}"
          body: |
            Auto-generated by Codex.

            ## Source

            - workflow: `${{ github.workflow }}`
            - run: `${{ github.run_id }}`
            - issue: `${{ env.ISSUE_NUMBER }}`

            ## Task

            ${{ env.TASK_BODY }}

            ## Verification

            ${{ env.VERIFICATION_COMMANDS }}
          labels: |
            codex
            automated-pr

      - name: Comment on linked issue
        if: ${{ env.ISSUE_NUMBER != '' && steps.cpr.outputs.pull-request-url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const prUrl = `${{ steps.cpr.outputs.pull-request-url }}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number,
              body: `Codex prepared a PR for this task: ${prUrl}`,
            });
