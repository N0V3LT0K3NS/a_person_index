name: Dispatch Codex Queue Item

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Task ID from .github/codex/task_queue.yaml
        required: true
        type: string
      dry_run:
        description: Render the task but do not open an issue
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install queue renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Render queue item
        run: |
          python scripts/render_codex_task_from_queue.py "${{ inputs.task_id }}" --format json > task.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("task.json").read_text())
          Path("task-title.txt").write_text(payload["title"], encoding="utf-8")
          Path("task-body.md").write_text(payload["body"], encoding="utf-8")
          print(payload["title"])
          PY

      - name: Show rendered task
        run: |
          echo "Title:"
          cat task-title.txt
          echo
          echo "Body:"
          cat task-body.md

      - name: Check for existing open issue
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="$(cat task-title.txt)"
          MATCHES="$(gh issue list --state open --search "\"${TITLE}\" in:title" --json title --jq 'map(select(.title == "'"${TITLE}"'")) | length')"
          echo "OPEN_MATCHES=${MATCHES}" >> "$GITHUB_ENV"

      - name: Ensure codex-task label exists
        if: ${{ !inputs.dry_run && env.OPEN_MATCHES == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create codex-task \
            --color 5319E7 \
            --description "Request a scoped Codex-driven repo change" \
            || true

      - name: Create issue
        if: ${{ !inputs.dry_run && env.OPEN_MATCHES == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "$(cat task-title.txt)" \
            --body-file task-body.md \
            --label codex-task

      - name: Resolve issue number
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="$(cat task-title.txt)"
          ISSUE_NUMBER="$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number,title --jq 'map(select(.title == "'"${TITLE}"'")) | .[0].number // ""')"
          echo "ISSUE_NUMBER=${ISSUE_NUMBER}" >> "$GITHUB_ENV"

      - name: Skip duplicate issue
        if: ${{ !inputs.dry_run && env.OPEN_MATCHES != '0' }}
        run: |
          echo "An open issue with this exact title already exists. Skipping creation."

      - name: Dispatch codex-task workflow
        if: ${{ !inputs.dry_run && env.ISSUE_NUMBER != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const taskTitle = fs.readFileSync("task-title.txt", "utf8").trim();
            const taskBody = fs.readFileSync("task-body.md", "utf8");
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "codex-task.yml",
              ref: "main",
              inputs: {
                task_title: taskTitle,
                task_body: taskBody,
                issue_number: process.env.ISSUE_NUMBER,
              },
            });
