name: Netlify Deploy

on:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check Netlify configuration
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "${NETLIFY_AUTH_TOKEN}" ] && [ -n "${NETLIFY_SITE_ID}" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Netlify deploy because required secrets are missing."
          fi

      - name: Check out repository
        if: ${{ steps.netlify.outputs.can_deploy == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.netlify.outputs.can_deploy == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ steps.netlify.outputs.can_deploy == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Build registry outputs
        if: ${{ steps.netlify.outputs.can_deploy == 'true' }}
        run: |
          python scripts/build_index.py
          python scripts/generate_docs.py

      - name: Deploy preview to Netlify
        if: ${{ steps.netlify.outputs.can_deploy == 'true' && github.ref != 'refs/heads/main' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify deploy --dir=site --message "GitHub Actions ${GITHUB_SHA}"

      - name: Deploy production to Netlify
        if: ${{ steps.netlify.outputs.can_deploy == 'true' && github.ref == 'refs/heads/main' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify deploy --prod --dir=site --message "GitHub Actions ${GITHUB_SHA}"
